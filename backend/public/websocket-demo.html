<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Demo - Real-time Communication</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 10px;
        }

        .status.connected {
            background: #10b981;
        }

        .status.disconnected {
            background: #ef4444;
        }

        .controls {
            padding: 20px 30px;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
        }

        .control-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        input, button {
            padding: 10px 15px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-size: 1rem;
        }

        input {
            flex: 1;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .messages {
            padding: 20px 30px;
            max-height: 400px;
            overflow-y: auto;
        }

        .message {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .message-event {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 5px;
        }

        .message-data {
            color: #4b5563;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message-time {
            font-size: 0.8rem;
            color: #9ca3af;
            margin-top: 5px;
        }

        .stats {
            padding: 20px 30px;
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #6b7280;
            margin-top: 5px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #4b5563;
            font-weight: 600;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🔌 WebSocket Real-time Demo</h1>
        <div class="status disconnected" id="status">Disconnected</div>
    </div>

    <div class="controls">
        <div class="control-group">
            <input type="text" id="token" placeholder="Enter JWT Token"/>
            <button id="connectBtn">Connect</button>
            <button id="disconnectBtn" disabled>Disconnect</button>
        </div>

        <div class="control-grid">
            <div>
                <label>Join Room:</label>
                <div class="control-group">
                    <input type="text" id="roomId" placeholder="room-123"/>
                    <button id="joinRoomBtn" disabled>Join</button>
                </div>
            </div>
            <div>
                <label>Subscribe Channel:</label>
                <div class="control-group">
                    <input type="text" id="channelId" placeholder="news-channel"/>
                    <button id="subscribeBtn" disabled>Subscribe</button>
                </div>
            </div>
        </div>

        <div class="control-group">
            <input type="text" id="message" placeholder="Type a message..."/>
            <button id="sendMessageBtn" disabled>Send Message</button>
            <button id="pingBtn" disabled>Ping</button>
        </div>
    </div>

    <div class="messages" id="messages">
        <div class="message">
            <div class="message-event">ℹ️ Info</div>
            <div class="message-data">Enter your JWT token and click Connect to start WebSocket connection.</div>
            <div class="message-time">Waiting to connect...</div>
        </div>
    </div>

    <div class="stats">
        <div>
            <div class="stat-value" id="messageCount">0</div>
            <div class="stat-label">Messages</div>
        </div>
        <div>
            <div class="stat-value" id="connectionTime">--</div>
            <div class="stat-label">Connected</div>
        </div>
        <div>
            <div class="stat-value" id="socketId">--</div>
            <div class="stat-label">Socket ID</div>
        </div>
        <div>
            <div class="stat-value" id="latency">--</div>
            <div class="stat-label">Latency (ms)</div>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    let socket = null;
    let messageCount = 0;
    let connectionStartTime = null;
    let connectionTimer = null;
    let pingStartTime = null;

    const elements = {
        token: document.getElementById('token'),
        connectBtn: document.getElementById('connectBtn'),
        disconnectBtn: document.getElementById('disconnectBtn'),
        joinRoomBtn: document.getElementById('joinRoomBtn'),
        subscribeBtn: document.getElementById('subscribeBtn'),
        sendMessageBtn: document.getElementById('sendMessageBtn'),
        pingBtn: document.getElementById('pingBtn'),
        roomId: document.getElementById('roomId'),
        channelId: document.getElementById('channelId'),
        message: document.getElementById('message'),
        status: document.getElementById('status'),
        messages: document.getElementById('messages'),
        messageCountEl: document.getElementById('messageCount'),
        connectionTimeEl: document.getElementById('connectionTime'),
        socketIdEl: document.getElementById('socketId'),
        latencyEl: document.getElementById('latency')
    };

    // Connect to WebSocket
    elements.connectBtn.addEventListener('click', () => {
        const token = elements.token.value.trim();

        if (!token) {
            addMessage('error', '❌ Error', 'Please enter a JWT token');
            return;
        }

        connect(token);
    });

    // Disconnect
    elements.disconnectBtn.addEventListener('click', () => {
        disconnect();
    });

    // Join room
    elements.joinRoomBtn.addEventListener('click', () => {
        const roomId = elements.roomId.value.trim();
        if (roomId && socket) {
            socket.emit('join:room', roomId);
            addMessage('system', '🚪 Join Room', `Joining room: ${roomId}`);
        }
    });

    // Subscribe to channel
    elements.subscribeBtn.addEventListener('click', () => {
        const channelId = elements.channelId.value.trim();
        if (channelId && socket) {
            socket.emit('subscribe', channelId);
            addMessage('system', '📡 Subscribe', `Subscribing to: ${channelId}`);
        }
    });

    // Send message
    elements.sendMessageBtn.addEventListener('click', () => {
        const message = elements.message.value.trim();
        if (message && socket) {
            socket.emit('message', {text: message});
            addMessage('sent', '📤 Sent', message);
            elements.message.value = '';
        }
    });

    // Ping
    elements.pingBtn.addEventListener('click', () => {
        if (socket) {
            pingStartTime = Date.now();
            socket.emit('ping');
            addMessage('system', '🏓 Ping', 'Sending ping...');
        }
    });

    // Enter to send
    elements.message.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            elements.sendMessageBtn.click();
        }
    });

    function connect(token) {
        // Close existing connection
        if (socket) {
            disconnect();
        }

        // Clear messages
        elements.messages.innerHTML = '';
        messageCount = 0;
        updateMessageCount();

        // Create socket connection
        socket = io('http://localhost:3000', {
            auth: {
                token: token
            },
            transports: ['websocket', 'polling']
        });

        connectionStartTime = Date.now();
        startConnectionTimer();

        // Connection events
        socket.on('connect', () => {
            updateStatus(true);
            addMessage('system', '✅ Connected', `Socket ID: ${socket.id}`);
            elements.socketIdEl.textContent = socket.id.substring(0, 8) + '...';
            enableButtons(true);
        });

        socket.on('connected', (data) => {
            addMessage('connected', '🎉 Welcome', JSON.stringify(data, null, 2));
        });

        socket.on('disconnect', () => {
            updateStatus(false);
            addMessage('system', '❌ Disconnected', 'Connection closed');
            enableButtons(false);
            stopConnectionTimer();
        });

        socket.on('connect_error', (error) => {
            addMessage('error', '❌ Connection Error', error.message);
            updateStatus(false);
            enableButtons(false);
        });

        // Custom events
        socket.on('notification', (data) => {
            addMessage('notification', '🔔 Notification', JSON.stringify(data, null, 2));
        });

        socket.on('joined:room', (data) => {
            addMessage('room', '🚪 Joined Room', JSON.stringify(data, null, 2));
            elements.roomId.value = '';
        });

        socket.on('left:room', (data) => {
            addMessage('room', '🚪 Left Room', JSON.stringify(data, null, 2));
        });

        socket.on('subscribed', (data) => {
            addMessage('channel', '📡 Subscribed', JSON.stringify(data, null, 2));
            elements.channelId.value = '';
        });

        socket.on('unsubscribed', (data) => {
            addMessage('channel', '📡 Unsubscribed', JSON.stringify(data, null, 2));
        });

        socket.on('message:received', (data) => {
            addMessage('received', '✅ Message Received', JSON.stringify(data, null, 2));
        });

        socket.on('pong', (data) => {
            if (pingStartTime) {
                const latency = Date.now() - pingStartTime;
                elements.latencyEl.textContent = latency;
                addMessage('system', '🏓 Pong', `Latency: ${latency}ms`);
                pingStartTime = null;
            }
        });

        // Catch-all for any event
        socket.onAny((event, ...args) => {
            console.log('Event received:', event, args);
        });
    }

    function disconnect() {
        if (socket) {
            socket.disconnect();
            socket = null;
            updateStatus(false);
            stopConnectionTimer();
            enableButtons(false);
            addMessage('system', '👋 Disconnected', 'Connection closed by user');
        }
    }

    function addMessage(type, event, data) {
        messageCount++;
        updateMessageCount();

        const messageEl = document.createElement('div');
        messageEl.className = 'message';
        messageEl.innerHTML = `
                <div class="message-event">${event}</div>
                <div class="message-data">${data}</div>
                <div class="message-time">${new Date().toLocaleTimeString()}</div>
            `;

        elements.messages.insertBefore(messageEl, elements.messages.firstChild);

        // Keep only last 50 messages
        while (elements.messages.children.length > 50) {
            elements.messages.removeChild(elements.messages.lastChild);
        }
    }

    function updateStatus(connected) {
        elements.status.textContent = connected ? 'Connected' : 'Disconnected';
        elements.status.className = connected ? 'status connected' : 'status disconnected';
    }

    function enableButtons(enabled) {
        elements.connectBtn.disabled = enabled;
        elements.disconnectBtn.disabled = !enabled;
        elements.joinRoomBtn.disabled = !enabled;
        elements.subscribeBtn.disabled = !enabled;
        elements.sendMessageBtn.disabled = !enabled;
        elements.pingBtn.disabled = !enabled;
    }

    function updateMessageCount() {
        elements.messageCountEl.textContent = messageCount;
    }

    function startConnectionTimer() {
        stopConnectionTimer();
        connectionTimer = setInterval(() => {
            if (connectionStartTime) {
                const elapsed = Math.floor((Date.now() - connectionStartTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                elements.connectionTimeEl.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            }
        }, 1000);
    }

    function stopConnectionTimer() {
        if (connectionTimer) {
            clearInterval(connectionTimer);
            connectionTimer = null;
            elements.connectionTimeEl.textContent = '--';
        }
    }

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
        disconnect();
    });
</script>
</body>
</html>
